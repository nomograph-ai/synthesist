# gitlab.com/nomograph/synthesist .gitlab-ci.yml
#
# Pipeline structure provided by nomograph/pipeline tool-rust@v5.2.1:
# stages, default policy (retry/timeout/interruptible), gates (hygiene,
# license-policy, readme-shape, release-discipline, registry-coherence,
# deps-scan), agent-shape check, build matrix, cosign signing, package
# registry upload, crates.io publish, GitLab release, notify-kits.

default:
  tags: [storr]

include:
  - component: gitlab.com/nomograph/pipeline/tool-rust@v5.11.0
    inputs:
      binary_name: synthesist
      project_description: "Specification graph manager for AI-augmented projects, on the nomograph-claim substrate."
      # crates.io publish is DEFERRED for pre.1: tagging ships the
      # BINARY only and must not push to the registry. Flip back to
      # true (with crates_workspace_packages restored) when publish is
      # re-enabled in a later phase.
      crates_publish: false
  # Fail-closed automerge gate (renovate-architecture L1 verdict
  # contract): osv-verdict -> CHECK_OSV, cargo-verdict -> CHECK_CARGO
  # (builds+tests the workspace), automerge-gate blocks unless every
  # required check is PRESENT and ==pass. The gate job's green/red is
  # the pipeline status Renovate reads before GitLab native auto-merge.

  # Secret detection that BLOCKS, replacing the upstream
  # Jobs/Secret-Detection.gitlab-ci.yml template. That template cannot
  # fail a pipeline on a leaked credential: its analyzer invokes gitleaks
  # with --exit-code 0, so the process exits 0 even when it found
  # secrets, and flipping allow_failure only makes OPERATIONAL faults
  # blocking. secret-verdict runs the same analyzer with the same ruleset
  # (identical scan surface -- this is a swap of the include:, not a
  # change in what gets flagged), then parses
  # gl-secret-detection-report.json, exits nonzero on a non-empty
  # vulnerabilities array, and fails closed when the report is absent.
  # The verdict trio moves to @v5.10.0 together with secret-verdict, not
  # opportunistically: automerge-gate's secret_job needs-slot (how
  # CHECK_SECRET reaches the gate) exists only from v5.10.0, and the
  # v5.10.0 gate carries the bare-branch rule clause that osv-verdict and
  # cargo-verdict gained in 5.8.0/5.9.1 -- bumping the gate alone would
  # instantiate it on branch pushes where the older verdicts still do not
  # run, and it would block fail-closed on absent CHECK_OSV/CHECK_CARGO.
  - component: gitlab.com/nomograph/pipeline/secret-verdict@v5.11.0
    inputs:
      stage: verdict
  - component: gitlab.com/nomograph/pipeline/osv-verdict@v5.11.0
    inputs:
      stage: verdict
  - component: gitlab.com/nomograph/pipeline/cargo-verdict@v5.11.0
    inputs:
      stage: verdict
      cargo_test_args: "--workspace"
  - component: gitlab.com/nomograph/pipeline/automerge-gate@v5.11.0
    inputs:
      stage: gate
      required-checks: "osv,cargo,secret"

stages: [lint, test, build, sign, publish, release, notify, verdict, gate]

# Backstop against the .agent/skills recurrence class. If any committed
# symlink in this repo resolves to an absolute path, fail before CI
# spends time on the heavier stages. See scripts/check-symlinks.sh.
check-symlinks:
  stage: lint
  image: alpine:3.24@sha256:28bd5fe8b56d1bd048e5babf5b10710ebe0bae67db86916198a6eec434943f8b
  before_script:
    - apk add --no-cache bash git
  script:
    - bash scripts/check-symlinks.sh
